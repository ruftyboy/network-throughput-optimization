name: SNDlib weighted benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - sndlib_benchmark.py
      - requirements.txt
      - .github/workflows/sndlib.yml
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python sndlib_benchmark.py --seconds 25
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sndlib-results
          path: results/sndlib.json
          if-no-files-found: warn
          retention-days: 30
