name: Dual-guided edge screening
on:
  workflow_dispatch:
  push:
    paths:
      - screening_benchmark.py
      - summarize_screening.py
      - .github/workflows/screening.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python screening_benchmark.py --mode self-test
  zoo:
    needs: verify
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        capacity: [unit, heterogeneous]
        offset: [0, 30, 60, 90]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python screening_benchmark.py --mode zoo --capacity ${{ matrix.capacity }} --offset ${{ matrix.offset }} --limit 30 --seconds 5 --iterations 12 --output results/${{ matrix.capacity }}-${{ matrix.offset }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screening-${{ matrix.capacity }}-${{ matrix.offset }}
          path: results/*.json
          if-no-files-found: warn
          retention-days: 30
  published:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python screening_benchmark.py --mode published --seconds 30 --iterations 12 --output results/published.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screening-published
          path: results/published.json
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: [zoo, published]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: screening-*
          path: inputs
      - run: python summarize_screening.py inputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screening-summary
          path: results/screening-summary.json
          if-no-files-found: warn
          retention-days: 30
