name: Balanced network research
on:
  workflow_dispatch:
  push:
    paths:
      - balanced_benchmark.py
      - summarize_balanced.py
      - .github/workflows/balanced.yml
permissions:
  contents: read
jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python balanced_benchmark.py --mode self-test
  historical:
    needs: self-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python balanced_benchmark.py --mode traces --train 3 --test 6 --seconds 45 --output results/historical.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balanced-historical
          path: results/historical.json
          if-no-files-found: warn
          retention-days: 30
  zoo:
    needs: self-test
    strategy:
      fail-fast: false
      matrix:
        offset: [0, 30, 60, 90]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python balanced_benchmark.py --mode zoo --train 6 --test 12 --seed 20261125 --limit 30 --offset ${{ matrix.offset }} --seconds 15 --output results/zoo-${{ matrix.offset }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balanced-zoo-${{ matrix.offset }}
          path: results/zoo-${{ matrix.offset }}.json
          if-no-files-found: warn
          retention-days: 30
  aggregate:
    needs: [historical, zoo]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: balanced-*
          path: inputs
      - run: python summarize_balanced.py inputs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: balanced-summary
          path: results/aggregate.json
          if-no-files-found: warn
          retention-days: 30
