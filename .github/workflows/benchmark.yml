name: Network benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - benchmark.py
      - requirements.txt
      - .github/workflows/benchmark.yml
  schedule:
    - cron: '21 3 * * 1'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python benchmark.py --real --seeds 3 --seconds 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: results/benchmark.json
          if-no-files-found: warn
          retention-days: 30
